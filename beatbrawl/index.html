<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beat Brawl</title>
<style>
:root{--bg:#efeaf9;--fg:#2a2140;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0a16;--fg:#e9e4f7}}
:root[data-theme="dark"]{--bg:#0d0a16;--fg:#e9e4f7}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
canvas{width:min(100%,calc((100dvh - 70px) * 4 / 3));aspect-ratio:4/3;touch-action:none;border-radius:12px;background:#141022;display:block}
p{margin:0;font-size:13px;opacity:.8;text-align:center;padding:0 10px}
.bar{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;padding:0 10px}
.bar input{background:#3a2a6b;color:#fff;border:0;border-radius:8px;padding:7px 12px;font:inherit;width:150px}
.bar input::placeholder{color:#bda9ff}
</style>
</head>

function build(){

  for(let b=2;b<BARS;b++){
    const side=((b-2)>>1)%2===0?enemy:player;
    for(let i=0;i<8;i++){
      if(r()>(i%2?.42:.82))continue;
      let l=(r()*4)|0;if(l===last&&r()<.6)l=(l+1+((r()*3)|0))%4;last=l;
      const s=b*8+i,n={t:s*SD,l,s,hit:false,missed:false};

    }
  }
  player[player.length-1]&&0;
}
function tone(f,t,d,type,v){const o=ac.createOscillator(),n=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(n).connect(ac.destination);o.start(t);o.stop(t+d+.03)}
function kick(t){const o=ac.createOscillator(),n=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);n.gain.setValueAtTime(.55,t);n.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(n).connect(ac.destination);o.start(t);o.stop(t+.25)}
function noise(t,d,v,hp){const s=ac.createBufferSource(),f=ac.createBiquadFilter(),n=ac.createGain();s.buffer=noiseBuf;f.type='highpass';f.frequency.value=hp;n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f).connect(n).connect(ac.destination);s.start(t);s.stop(t+d)}
function playStep(s){
  const t=t0+s*SD,i=s%8,root=ROOT[((s/8)|0)%4];
  if(s>=(MUS-1)*8){if(i===0){kick(t);noise(t,1.2,.2,3000);[2,3,4,5,6].forEach(m=>tone(root*m,t,1.7,'triangle',.07));tone(root,t,1.7,'sawtooth',.1)}return}
  tone(i%2?root*2:root,t,SD*.9,'sawtooth',.1);
  if(i===0||i===3||i===4)kick(t);
  if(i===2||i===6)noise(t,.14,.18,1500);
  noise(t,.04,.05,7000);
  if(i===0)[4,5,6].forEach(m=>tone(root*m,t,SD*7.5,'triangle',.035));
  if(eAt[s]!==undefined)tone(FREQ[eAt[s]],t,SD*.8,'square',.06);
}
function start(){
  if(ac)try{ac.close()}catch(e){}
  ac=new(window.AudioContext||window.webkitAudioContext)();
  noiseBuf=ac.createBuffer(1,ac.sampleRate*.3,ac.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  nameEl.blur();saveMsg='';
  health=.5;score=0;combo=0;maxCombo=0;pop=null;
  cnt={sick:0,good:0,bad:0,miss:0};
  t0=ac.currentTime+BEAT*4;nextStep=0;songT=-BEAT*4;
  build();
  state='play';sel=0;held=[0,0,0,0];
}
function finish(s){state=s;sel=0;if(s==='over')try{ac.close()}catch(e){}submitScore(s==='win'?'win':'lose')}
function judge(dt){
  const ms=Math.abs(dt)*1000;
  if(ms<45){cnt.sick++;score+=350;health+=.03;return['SICK!','#7df9ff']}
  if(ms<90){cnt.good++;score+=200;health+=.02;return['Good','#8dff8d']}
  cnt.bad++;score+=50;health+=.005;combo=Math.max(0,combo-0);return['Bad','#ffb347'];
}
function press(l){
  if(state!=='play'||held[l])return;
  held[l]=1;
  let best=null;
  for(const n of player)if(!n.hit&&!n.missed&&Math.abs(n.t-songT)<.135&&n.l===l&&(!best||Math.abs(n.t-songT)<Math.abs(best.t-songT)))best=n;
  if(!best)return;
  best.hit=true;combo++;maxCombo=Math.max(maxCombo,combo);
  const[j,c]=judge(best.t-songT);pop={txt:j,col:c,t:songT};
  pFlash[l]=songT;pPose={l,t:songT,miss:false};
  tone(FREQ[l],ac.currentTime,.18,'triangle',.18);
  health=Math.min(1,health);
}
function miss(){
  cnt.miss++;combo=0;health-=.06;score-=10;pop={txt:'Miss',col:'#ff5d6c',t:songT};
  pPose={l:-1,t:songT,miss:true};tone(70,ac.currentTime,.2,'sawtooth',.12);
}
addEventListener('keydown',e=>{
  if(e.target===nameEl){if(e.code==='Enter'||e.code==='Escape')nameEl.blur();return}
  if(state==='play'){
    if((e.code==='Escape'||e.code==='KeyP')&&!e.repeat){pause();return}
    if(e.code in KEYS){e.preventDefault();if(!e.repeat)press(KEYS[e.code])}
    return;
  }
  const its=items();
  if(e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();sel=(sel+its.length-1)%its.length}
  else if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();sel=(sel+1)%its.length}
  else if(e.code==='Enter'||e.code==='Space'){e.preventDefault();if(!e.repeat)its[sel].a()}
  else if(e.code==='Escape'&&!e.repeat){if(state==='pause')resume();else if(state!=='menu')toMenu()}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
const SPDS=[330,430,540],SPN=['Slow','Normal','Fast'];
function toMenu(){if(ac)try{ac.close()}catch(e){}state='menu';sel=0}
function pause(){if(state!=='play')return;state='pause';sel=0;ac.suspend()}
function resume(){if(state!=='pause')return;state='play';ac.resume()}
function items(){
  if(state==='menu')return[{l:'Play',a:start},{l:'Scroll speed: '+SPN[speedIdx],a:()=>{speedIdx=(speedIdx+1)%3;SPD=SPDS[speedIdx]}},{l:'Leaderboard',a:()=>{state='scores';sel=0;loadScores()}},{l:'How to play',a:()=>{state='help';sel=0}}];
  if(state==='scores')return[{l:'Back',a:toMenu}];
  if(state==='pause')return[{l:'Resume',a:resume},{l:'Restart',a:start},{l:'Exit to menu',a:toMenu}];
  if(state==='help')return[{l:'Back',a:toMenu}];
  return[{l:'Play again',a:start},{l:'Main menu',a:toMenu}];
}
function baseY(){return state==='menu'?385:state==='pause'?260:state==='help'?500:state==='scores'?540:430}

function cpos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}

function hitItem(e){const[x,y]=cpos(e),b=baseY(),n=items().length;for(let i=0;i<n;i++){const cy=b+i*56;if(x>250&&x<550&&y>cy-23&&y<cy+23)return i}return -1}
addEventListener('keyup',e=>{if(e.code in KEYS)held[KEYS[e.code]]=0});
cv.addEventListener('pointerdown',e=>{
  const[x,y]=cpos(e);
  if(state==='play'){if(x>372&&x<428&&y<44){pause();return}press(Math.min(3,Math.max(0,Math.floor(x/W*4))));return}
  const i=hitItem(e);if(i>=0){sel=i;items()[i].a()}
});
cv.addEventListener('pointermove',e=>{if(state!=='play'){const i=hitItem(e);if(i>=0)sel=i}});
addEventListener('pointerup',()=>{held=[0,0,0,0]});

function update(){
  if(state!=='play')return;
  songT=ac.currentTime-t0;
  while(nextStep*SD+t0<ac.currentTime+.25&&nextStep<MUS*8){playStep(nextStep);nextStep++}
  for(const n of enemy)if(!n.hit&&n.t<=songT){n.hit=true;eFlash[n.l]=songT;ePose={l:n.l,t:songT};if(health>.12)health-=.008}
  for(const n of player)if(!n.hit&&!n.missed&&songT-n.t>.135){n.missed=true;miss()}
  health=Math.min(1,health);
  if(health<=0){finish('over');return}
  if(songT>(MUS-1)*8*SD+1.6)finish('win');
}
function T(s,x,y,sz,c,a,w){g.font=(w||'bold')+' '+sz+'px "Trebuchet MS",system-ui,sans-serif';g.fillStyle=c;g.textAlign=a||'center';g.fillText(s,x,y)}
function arrow(x,y,l,s,fill,stroke,a){
  g.save();g.translate(x,y);g.rotate(ANG[l]);g.globalAlpha=a==null?1:a;
  g.beginPath();g.moveTo(0,-s);g.lineTo(s*.95,s*.1);g.lineTo(s*.38,s*.1);g.lineTo(s*.38,s);g.lineTo(-s*.38,s);g.lineTo(-s*.38,s*.1);g.lineTo(-s*.95,s*.1);g.closePath();
  if(fill){g.fillStyle=fill;g.fill()}
  if(stroke){g.lineWidth=4;g.strokeStyle=stroke;g.lineJoin='round';g.stroke()}
  g.restore();
}
function char(x,y,kind,pose,bop){
  const dx=[-12,0,0,12][pose.l]||0,dy=[0,10,-10,0][pose.l]||0,act=pose.l>=0;
  g.save();g.translate(x,y);
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(0,0,46,10,0,0,7);g.fill();
  const c=pose.miss?'#6b6b7a':(kind?'#3a7bff':'#ff5fa8');
  g.fillStyle=c;g.beginPath();g.roundRect(-26+dx*.4,-70-bop*3,52,60,12);g.fill();
  g.lineWidth=9;g.lineCap='round';g.strokeStyle=c;
  g.beginPath();g.moveTo(-24,-52-bop*3);g.lineTo(-40,-34+(act?dy-20:0));g.moveTo(24,-52-bop*3);g.lineTo(40,-34+(act?dy-20:0));g.stroke();
  
  const hy=-98-bop*5+dy*.5,hx=dx;
  g.fillStyle='#ffe3c8';
  if(kind){g.beginPath();g.arc(hx,hy,27,0,7);g.fill();g.strokeStyle='#1c1c3a';g.lineWidth=7;g.beginPath();g.arc(hx,hy-2,30,Math.PI,0);g.stroke();g.fillStyle='#1c1c3a';g.fillRect(hx-34,hy-8,10,20);g.fillRect(hx+24,hy-8,10,20)}
  else{g.beginPath();g.roundRect(hx-27,hy-27,54,54,10);g.fill();g.strokeStyle='#ff5fa8';g.lineWidth=4;g.beginPath();g.moveTo(hx,hy-27);g.lineTo(hx,hy-44);g.stroke();g.fillStyle='#ff5fa8';g.beginPath();g.arc(hx,hy-46,6,0,7);g.fill()}
  g.fillStyle='#1c1c3a';g.beginPath();g.arc(hx-10,hy-4,4,0,7);g.arc(hx+10,hy-4,4,0,7);g.fill();
  if(act){g.beginPath();g.ellipse(hx,hy+13,8,6+4,0,0,7);g.fill()}
  else if(pose.miss){g.fillRect(hx-8,hy+12,16,3)}
  else{g.fillRect(hx-7,hy+12,14,3)}
  g.restore();
}
function draw(){
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#1b1235');bg.addColorStop(1,'#0e0a1c');
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  if(state!=='menu'&&state!=='help'&&state!=='scores'&&bgImg.complete&&bgImg.naturalWidth){
    const sc=Math.max(W/bgImg.naturalWidth,H/bgImg.naturalHeight),iw=bgImg.naturalWidth*sc,ih=bgImg.naturalHeight*sc;
    g.drawImage(bgImg,(W-iw)/2,(H-ih)/2,iw,ih);
    g.fillStyle='rgba(8,5,18,.5)';g.fillRect(0,0,W,H);
  }
  if(state==='scores'){
    T('Leaderboard',W/2,80,50,'#fff');
    if(board===null)T('Loading…',W/2,300,22,'#bda9ff','center','normal');
    else if(board==='err')T('Could not load scores (open the game through XAMPP)',W/2,300,20,'#ff9fa8','center','normal');
    else if(!board.length)T('No scores yet. Be the first!',W/2,300,22,'#bda9ff','center','normal');
    else{
      T('#',130,135,16,'#bda9ff','left');T('Player',170,135,16,'#bda9ff','left');
      T('Score',500,135,16,'#bda9ff','right');T('Acc',590,135,16,'#bda9ff','right');T('Combo',680,135,16,'#bda9ff','right');
      board.forEach((r,i)=>{
        const y=172+i*36,c=i===0?'#ffd84d':'#fff';
        T(String(i+1),130,y,20,c,'left');T(String(r.name).slice(0,20),170,y,20,c,'left','normal');
        T(String(r.score),500,y,20,c,'right');T(r.accuracy+'%',590,y,20,c,'right','normal');T(String(r.combo),680,y,20,c,'right','normal');
      });
    }
    drawItems();return;
  }
  if(state==='help'){
    T('How to play',W/2,110,50,'#fff');
    ['Arrows scroll up toward the top row.','Hit your column when an arrow lands on it:','D F J K or the arrow keys. On touch, tap the columns.','Sick and Good hits fill your side of the health bar.','Misses drain it. Pause with Esc or P, or the II button.'].forEach((s,i)=>T(s,W/2,200+i*42,20,'#d8ccff','center','normal'));
    drawItems();return;
  }
  if(state==='menu'){
    for(let i=0;i<4;i++)arrow(190+i*140,160+Math.sin(performance.now()/300+i)*8,i,44,COL[i],'#fff');
    T('BEAT BRAWL',W/2,300,76,'#fff');
    T('An original rhythm battle in the arcade-funk style',W/2,345,20,'#bda9ff','center','normal');
    drawItems();
    return;
  }
  const px0=500,ex0=20;
  g.fillStyle='rgba(255,255,255,.05)';g.fillRect(ex0,0,LW*4,H-50);g.fillRect(px0,0,LW*4,H-50);
  g.fillStyle='#ff5fa8';g.globalAlpha=.7;T('RIVAL',ex0+LW*2,40,16,'#ff9fcb');T('YOU',px0+LW*2,40,16,'#8fb5ff');g.globalAlpha=1;
  for(let i=0;i<4;i++){
    const ex=ex0+i*LW+LW/2,px=px0+i*LW+LW/2;
    arrow(ex,RY,i,26,songT-eFlash[i]<.12?COL[i]:null,'rgba(255,255,255,.4)');
    const on=held[i]||songT-pFlash[i]<.12;
    arrow(px,RY,i,on?29:26,on?COL[i]:null,on?'#fff':'rgba(255,255,255,.4)');
  }
  for(const n of enemy){if(n.hit)continue;const y=RY+(n.t-songT)*SPD;if(y>H)break;arrow(ex0+n.l*LW+LW/2,y,n.l,26,COL[n.l],'#fff')}
  for(const n of player){if(n.hit)continue;const y=RY+(n.t-songT)*SPD;if(y>H+40)break;if(y<-40)continue;arrow(px0+n.l*LW+LW/2,y,n.l,26,COL[n.l],'#fff',n.missed?.25:1)}
  const bop=Math.abs(Math.sin(Math.max(0,songT)/BEAT*Math.PI));
  const ep=songT-ePose.t<.25?ePose:{l:-1},pp=songT-pPose.t<.3?pPose:{l:-1};
  char(375,470,0,ep,bop);char(445,500,1,pp,bop);
  if(songT<0){const k=Math.ceil(-songT/BEAT);T(k===1?'GO!':String(k-1),W/2,300,90,'#ffd84d')}
  if(pop&&songT-pop.t<.6){g.globalAlpha=1-(songT-pop.t)/.6;T(pop.txt,400,260-(songT-pop.t)*30,34,pop.col);g.globalAlpha=1}
  if(combo>2)T(combo+' combo',400,300,24,'#fff');
  
  const bx=150,bw=500,by=556,bpx=bx+(1-health)*bw;
  g.fillStyle='#ff5fa8';g.fillRect(bx,by,bpx-bx,14);g.fillStyle='#3a7bff';g.fillRect(bpx,by,bx+bw-bpx,14);
  g.lineWidth=3;g.strokeStyle='#fff';g.strokeRect(bx,by,bw,14);
  g.fillStyle='#ffe3c8';g.beginPath();g.arc(bpx-18,by+7,15,0,7);g.arc(bpx+18,by+7,15,0,7);g.fill();
  T('Score '+score,bx,590,18,'#d8ccff','left');
  
  const tot=cnt.sick+cnt.good+cnt.bad+cnt.miss;
  T(tot?'Accuracy '+acc()+'%':'',bx+bw,590,18,'#d8ccff','right');
  if(state==='play'){g.fillStyle='rgba(255,255,255,.12)';g.beginPath();g.roundRect(372,8,56,34,8);g.fill();g.fillStyle='#fff';g.fillRect(391,16,6,18);g.fillRect(403,16,6,18)}
  if(state==='pause')pauseScreen();
  if(state==='over'||state==='win')endScreen();
}
function drawItems(){items().forEach((it,i)=>{const y=baseY()+i*56,on=i===sel;g.fillStyle=on?'rgba(255,216,77,.18)':'rgba(255,255,255,.07)';g.beginPath();g.roundRect(250,y-23,300,46,12);g.fill();g.lineWidth=3;g.strokeStyle=on?'#ffd84d':'rgba(255,255,255,.25)';g.stroke();T(it.l,W/2,y+8,22,on?'#ffd84d':'#fff')})}
function pauseScreen(){g.fillStyle='rgba(8,5,18,.8)';g.fillRect(0,0,W,H);T('Paused',W/2,170,56,'#fff');drawItems()}
function acc(){const tot=cnt.sick+cnt.good+cnt.bad+cnt.miss;return tot?Math.round((cnt.sick+cnt.good*.75+cnt.bad*.4)/tot*100):0}
function endScreen(){
  
  g.fillStyle='rgba(8,5,18,.82)';g.fillRect(0,0,W,H);
  const a=acc(),rank=a>=95?'S':a>=85?'A':a>=70?'B':a>=50?'C':'D';
  if(state==='over'){T('You lost the battle',W/2,170,50,'#ff6b7a');}
  else{T('Song cleared!',W/2,170,50,'#7df9ff');T('Rank '+rank,W/2,250,64,'#ffd84d')}
  T('Score '+score+'   Accuracy '+a+'%   Best combo '+maxCombo,W/2,320,22,'#fff','center','normal');
  T('Sick '+cnt.sick+'   Good '+cnt.good+'   Bad '+cnt.bad+'   Miss '+cnt.miss,W/2,358,20,'#bda9ff','center','normal');
  T(saveMsg,W/2,395,18,saveMsg==='Score saved!'?'#8dff8d':saveMsg.startsWith('Could')?'#ff9fa8':'#bda9ff','center','normal');
  drawItems();
}
(function loop(){requestAnimationFrame(loop);update();draw()})();
</script>
